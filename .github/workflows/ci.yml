name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # only to push UI test screenshots to the ci/ui-screenshots branch

jobs:
  # Everything that runs anywhere: format, vet (Linux and both Windows
  # architectures), all tests with the race detector, cross-builds.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format, vet, test, build
        run: make check

  # The Windows-only code for real: the pipe, DPAPI, a WireGuardNT adapter
  # with routes and the DNS rule, and an installer to try in a test VM.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test ./...
      - name: Fetch and check WireGuardNT
        shell: pwsh
        run: scripts\fetch-wireguard-nt.ps1 -Out build\wireguard-nt
      - name: Tunnel test (real adapter, routes, DNS rule)
        shell: pwsh
        run: |
          go test -c -o build\tunnel-test\tunnel.test.exe .\internal\tunnel
          Copy-Item build\wireguard-nt\sdk\wireguard-nt\bin\amd64\wireguard.dll build\tunnel-test\
          $env:HIFAZ_TUNNEL_TEST = "1"
          # Quoted: PowerShell would split -test.v at the dot.
          & build\tunnel-test\tunnel.test.exe '-test.v' '-test.run=TestTunnelUpDown'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the installers (x64 and arm64, as a release does)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          scripts\build.ps1 -Version 0.2.0 -Release
      - name: Install, check, remove (x64)
        shell: pwsh
        run: scripts\test-install.ps1 -Msi dist\Hifaz-0.2.0-x64.msi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: UI test (installed app, window, page, screenshots)
        shell: pwsh
        run: scripts\test-ui.ps1 -Msi dist\Hifaz-0.2.0-x64.msi -Out build\ui
      - name: Verify upgrade from the latest public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = "Hifaz-0.1.2-x64.msi"
          gh release download v0.1.2 --pattern "$previous*" --dir build
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
          $expected = ((Get-Content "build\$previous.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash "build\$previous").Hash -ne $expected) { throw "Published installer hash mismatch" }
          function Run-Msi([string]$action, [string]$path, [string]$log) {
            $msi = (Resolve-Path $path).Path
            $p = Start-Process msiexec.exe -ArgumentList "$action `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $log -Tail 100
              throw "MSI exit code $($p.ExitCode)"
            }
          }
          $candidate = "dist\Hifaz-0.2.0-x64.msi"
          Run-Msi "/i" "build\$previous" "build\upgrade-old.log"
          $dir = Join-Path $env:LOCALAPPDATA "Hifaz"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $marker = Join-Path $dir "upgrade-verification.txt"
          Set-Content $marker "preserve profile data"
          Run-Msi "/i" $candidate "build\upgrade-new.log"
          if ((Get-Content $marker) -ne "preserve profile data") { throw "Upgrade changed local data" }
          if ((Get-Service Hifaz).Status -ne "Running") { throw "Service failed to start after upgrade" }
          Run-Msi "/x" $candidate "build\upgrade-remove.log"
          if ((Get-Content $marker) -ne "preserve profile data") { throw "Uninstall changed local data" }
          if (Get-Service Hifaz -ErrorAction SilentlyContinue) { throw "Service remained after uninstall" }
      - name: Publish the UI screenshots to the ci/ui-screenshots branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          [ -d build/ui ] || exit 0
          cd build/ui
          git init -q -b ci/ui-screenshots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "UI test screenshots, run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci/ui-screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hifaz-ui-test
          path: build/ui/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hifaz-msi-test
          path: dist/*.msi*
          retention-days: 14
