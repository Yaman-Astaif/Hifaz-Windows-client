name: Release

# Builds the installers (x64 and arm64) and attaches them to a GitHub
# Release, with the notes from CHANGELOG.md.
#
# Two ways to start it:
#   - push a tag:     git tag -a v0.1.0 -m "Hifaz for Windows 0.1.0" && git push origin v0.1.0
#   - in the browser: Releases -> Draft a new release -> new tag v0.1.0 on main -> Publish
#     (title and description empty: they are filled from CHANGELOG)
# Both may fire for the same version; the run is idempotent (files are replaced).
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check tag format
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
      - name: Test
        run: go test ./...
      - name: Build the installers
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $v = "${{ github.ref_name }}".Substring(1)
          scripts\build.ps1 -Version $v -Release
      - name: Install, check, remove (x64) before publishing
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          scripts\test-install.ps1 -Msi "dist\Hifaz-$v-x64.msi"
      - name: Publish release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="$GITHUB_REF_NAME"; V="${T#v}"
          FILES=$(ls dist/Hifaz-$V-*.msi dist/Hifaz-$V-*.msi.sha256)
          awk -v v="$V" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" $FILES --clobber
            # Created in the browser without text: fill in the changelog notes.
            if [ -z "$(gh release view "$T" --json body --jq .body)" ]; then
              gh release edit "$T" --title "Hifaz for Windows $V" --notes-file notes.md
            fi
          else
            gh release create "$T" $FILES --title "Hifaz for Windows $V" --notes-file notes.md
          fi
